[package]
name = "hushwave"
version = "1.0.0"
description = "A native Windows ambient noise player for original, DMCA-safe soundscapes."
authors = ["Hushwave"]
edition = "2021"

[lib]
name = "hushwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
