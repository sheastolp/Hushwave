[package]
name = "hushwave"
version = "1.0.10"
description = "A native Windows ambient noise player with an original, DMCA-safe built-in library, plus optional online sound sources you provide your own key for."
authors = ["Hushwave"]
edition = "2021"

[lib]
name = "hushwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
